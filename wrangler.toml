name = "kuasuotaoli"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "NAV_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"

[vars]
PRINCIPAL_USD = "1000000"
STRATEGY_START_DATE = "2026-03-22"

# Secrets (set via `wrangler secret put`):
# BINANCE_API_KEY
# BINANCE_SECRET_KEY
# BYBIT_API_KEY
# BYBIT_SECRET_KEY
# LP_PASSWORDS   (comma-separated, e.g. "pass1,pass2")
