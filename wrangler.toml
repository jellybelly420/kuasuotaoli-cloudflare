name = "kuasuotaoli-cloudflare"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "NAV_KV"
id = "9b6aaee7fa934e13b3c6abd14ca5ba6d"
preview_id = "c8a2f338dfcb473bb96c540cab516811"

[[d1_databases]]
binding = "NAV_DB"
database_name = "kuasuotaoli"
database_id = "f2575b29-89c6-4214-9b93-f345cc8a673f"

# 实时取数改为 Worker 直接 fetch VPS 代理（PROXY_URL secret），
# 不再依赖 Cloudflare 隧道 / VPC 绑定。
# 需设置 secret：
#   wrangler secret put PROXY_URL              (例如 http://1.2.3.4:3000)
#   wrangler secret put EXCHANGE_PROXY_SECRET  (与 VPS 代理的 PROXY_SECRET 一致)

[vars]
PRINCIPAL_USD = "1000000"
STRATEGY_START_DATE = "2026-03-22"

# Secrets — set via `wrangler secret put <NAME>`:
#
# Binance 主账户:
#   BINANCE_MAIN_API_KEY
#   BINANCE_MAIN_SECRET_KEY
#
# Binance 子账户1:
#   BINANCE_SUB1_API_KEY
#   BINANCE_SUB1_SECRET_KEY
#
# Binance 子账户2:
#   BINANCE_SUB2_API_KEY
#   BINANCE_SUB2_SECRET_KEY
#
# Bybit 主账户:
#   BYBIT_MAIN_API_KEY
#   BYBIT_MAIN_SECRET_KEY
#
# Bybit 子账户1:
#   BYBIT_SUB1_API_KEY
#   BYBIT_SUB1_SECRET_KEY
#
# Bybit 子账户2:
#   BYBIT_SUB2_API_KEY
#   BYBIT_SUB2_SECRET_KEY
#
# 登录密码 (逗号分隔):
#   LP_PASSWORDS
